name: Terraform Plan (PR)

# Se déclenche sur toute PR qui touche l'infra — jamais sur push direct.
# Utilise le rôle en LECTURE SEULE (github_actions_plan), jamais le rôle
# de déploiement (github_actions), même si la PR vient d'une branche
# externe/fork : ce rôle ne peut rien modifier sur AWS.
on:
  pull_request:
    paths:
      - "infra/**"

permissions:
  id-token: write        # requis pour l'authentification OIDC
  contents: read
  pull-requests: write   # requis pour poster le commentaire sur la PR

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer les identifiants AWS (OIDC, rôle lecture seule)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890615325519:role/freelancehub-github-actions-plan-role
          aws-region: eu-west-3

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        # Les valeurs sensibles (db_password, jwt_secret_key) restent
        # masquées dans la sortie grâce à `sensitive = true` sur les
        # variables — Terraform affiche "(sensitive value)", jamais
        # la vraie valeur, même dans ce log/commentaire.
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          terraform plan -no-color -input=false | tee plan_output.txt
        continue-on-error: true

      - name: Poster le plan en commentaire sur la PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const maxLength = 65000; // limite de taille d'un commentaire GitHub
            let plan = fs.readFileSync('infra/plan_output.txt', 'utf8');
            if (plan.length > maxLength) {
              plan = plan.substring(0, maxLength) + '\n... (tronqué, voir les logs du job pour le plan complet)';
            }
            const body = `#### Terraform Plan 📖 (rôle lecture seule)\n<details><summary>Afficher le plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Échouer le job si le plan a échoué
        if: steps.plan.outcome == 'failure'
        run: exit 1
