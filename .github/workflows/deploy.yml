name: Build & Push to ECR

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: freelancehub-api
  ECS_CLUSTER: freelancehub-cluster
  ECS_SERVICE: freelancehub-service

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freelancehub
          POSTGRES_PASSWORD: freelancehub_dev
          POSTGRES_DB: freelancehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: ./app
        run: pip install -r requirements.txt

      - name: Lancer les tests avec couverture
        working-directory: ./app
        env:
          DB_URL: postgresql://freelancehub:freelancehub_dev@localhost:5432/freelancehub_test
          SECRET_KEY: test-secret-key-for-ci-only
        run: pytest --cov=app --cov-report=term-missing

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer les identifiants AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890615325519:role/freelancehub-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Connexion à ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build de l'image Docker (sans push, pour le scan)
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                        -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                        ./app

      - name: Scan de vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: 1   # ne bloque pas encore — comportement affiné en D.3
          trivyignores: .trivyignore


      - name: Push de l'image Docker
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Récupérer la Task Definition actuelle
        id: current-task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECR_REPOSITORY }} \
            --region ${{ env.AWS_REGION }} \
            --query "taskDefinition" > task-definition.json

      - name: Mettre à jour l'image dans la Task Definition
        id: new-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECR_REPOSITORY }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Déployer la nouvelle révision sur le Service ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.new-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
