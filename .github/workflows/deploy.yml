name: Build & Push to ECR

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'

# Permissions nécessaires pour l'authentification OIDC (pas de clé stockée)
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: freelancehub-api
  ECS_CLUSTER: freelancehub-cluster
  ECS_SERVICE: freelancehub-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Debug - Décoder le jeton OIDC
        run: |
          echo "Récupération du jeton OIDC..."
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Payload du jeton (décodé) :"
          echo "$IDTOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '.' || echo "$IDTOKEN" | cut -d'.' -f2 | base64 --decode
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
      # Authentification OIDC : aucune clé AWS stockée dans GitHub.
      # Le rôle est endossé temporairement via le jeton émis par GitHub.
      - name: Configurer les identifiants AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890615325519:role/freelancehub-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Connexion à ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build et push de l'image Docker
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                        -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                        ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
