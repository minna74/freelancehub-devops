name: Build & Push to ECR

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: freelancehub-api
  ECS_CLUSTER: freelancehub-cluster
  ECS_SERVICE: freelancehub-service

jobs:
  test:
    runs-on: ubuntu-latest

    # Service PostgreSQL éphémère, identifiants alignés avec tests/conftest.py
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freelancehub
          POSTGRES_PASSWORD: freelancehub_dev
          POSTGRES_DB: freelancehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: ./app
        run: pip install -r requirements.txt

      - name: Lancer les tests avec couverture
        working-directory: ./app
        env:
          DB_URL: postgresql://freelancehub:freelancehub_dev@localhost:5432/freelancehub_test
          SECRET_KEY: test-secret-key-for-ci-only
        run: pytest --cov=app --cov-report=term-missing

  build-and-push:
    needs: test   # ne démarre QUE si les tests passent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer les identifiants AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890615325519:role/freelancehub-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Connexion à ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build et push de l'image Docker
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                        -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                        ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
