name: Terraform Plan (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'

# Lecture seule : le jeton OIDC endosse un rôle qui ne peut QUE lire
# l'infra existante et l'état Terraform, jamais la modifier.
permissions:
  id-token: write
  contents: read
  pull-requests: write   # nécessaire pour poster le commentaire sur la PR

env:
  AWS_REGION: eu-west-3

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer les identifiants AWS (OIDC, lecture seule)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::890615325519:role/freelancehub-github-actions-plan-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Init
        working-directory: ./infra
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ./infra
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Poster le plan en commentaire sur la PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📋
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Déclenché par @${{ github.actor }} sur ce commit.*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Échec si le plan a échoué
        if: steps.plan.outcome == 'failure'
        run: exit 1
